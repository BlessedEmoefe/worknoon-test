services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: worknoon
      POSTGRES_PASSWORD: worknoon123
      POSTGRES_DB: refund_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worknoon -d refund_system"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    # Load OPENAI_API_KEY from the host/.env; keep DATABASE_URL on the Docker network host `db`
    env_file:
      - .env
    environment:
      # Must use hostname `db` (Compose service name), not localhost
      DATABASE_URL: postgresql://worknoon:worknoon123@db:5432/refund_system
      # Passed from the host environment / project `.env` via Compose interpolation
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/',(r)=>process.exit(r.statusCode&&r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
